                                  - generic [ref=e130]: 讲座摘
                                  - generic [ref=e132]: 要
                                  - generic [ref=e134]: ：
                                - paragraph [ref=e135]: "We examine the optimal pricing decisions of a firm offering both dedicated service options and a probabilistic service option, where customers can upfront select multiple services simultaneously and have a chance of eventually being served by one. Customers are heterogeneous in their preferences towards different services. Two pricing schemes for the probabilistic service are considered: an allocation-dependent pricing, where customers pay based on the service they eventually receive, and a fixed pricing, where customers pay a preset price regardless of which type of service they receive. We model the service system as a loss system and characterize the customer equilibrium choice behavior and the firm's optimal pricing decisions under both schemes. Our findings indicate that the introduction of a probabilistic service always enhances the firm profit and improves both service efficiency and quality by enabling finer customer segmentation and exploiting the pooling effect across service facilities. In contrast to fixed pricing, our analysis reveals that under allocation-dependent pricing: (i) all customers can obtain a positive utility; (ii) expanding service capacity does not always benefit the firm and can even reduce its profit; and (iii) providing only probabilistic service, i.e., offering fewer service options to customers, can be beneficial to the firm. Relative to fixed pricing, allocation-dependent pricing results in lower firm profit but a higher surplus to customers. Moreover, offering a probabilistic service creates a win-win outcome for both the firm and its customers under allocation-dependent pricing, whereas it leads to a win-lose outcome when fixed pricing is adopted."
                                - paragraph [ref=e136]:
                                  - generic [ref=e138]: 主讲人简
                                  - generic [ref=e140]: 介
                                  - generic [ref=e142]: ：
                                - paragraph [ref=e143]: Yulan Wang is a full professor and associated head (research) of the Department of the Logistics and Maritime Studies at Faculty of Business, the Hong Kong Polytechnic University. She has a broad research interest in supply chain management, socially responsible operations, platform operations, behavioral operations and OM-IS/Marketing interfaces. Her research work has been published and accepted by leading academic journals such as Management Science, Operations Research, Manufacturing & Service Operations Management, Marketing Science and Production and Operations Management. Dr Wang serves as an associate/senior editor of Manufacturing & Service Operations Management, Naval Research Logistics, and Production and Operations Management, and a department/area editor of Decision Sciences and Omega.
